site_name: first-try landed
site_description: Reflections on stuff as it happens
site_url: https://cpumarfrohberg.github.io/first_try_landed
repo_url: https://github.com/cpumarfrohberg/first_try_landed
repo_name: cpumarfrohberg/first_try_landed

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotate

plugins:
  - search
  - tags

nav:
  - Home: index.md
  - Blog:
    - Overview: blog/index.md
    - 2026:
      - "Structured Output: Passport Control at Departure, Not Customs at Arrival": blog/posts/structured_output_and_contracts.md
      - What I learned about decorators: blog/posts/decorators.md
    - 2025:
      - Understanding Python in simulating music: blog/posts/python-simulating-music.md
      - "Building a Django app for the better good": blog/posts/planning-pads-recycling-django.md
      - "The Python Data Model: Why len(collection), Not collection.len()": blog/posts/getting-fluent-in-python.md
  - Tags: tags.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true
